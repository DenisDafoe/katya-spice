<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a3a" />
      <stop offset="55%" stop-color="#3e5fa3" />
      <stop offset="100%" stop-color="#f2b39b" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3c7b2" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f3c7b2" stop-opacity="0" />
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="2400" height="1400" fill="url(#sky)" />
  <circle cx="1650" cy="420" r="320" fill="url(#glow)" />
  <g fill="#101827">
    <rect x="120" y="680" width="120" height="520" />
    <rect x="300" y="760" width="180" height="450" />
    <rect x="540" y="620" width="140" height="590" />
    <rect x="720" y="700" width="120" height="520" />
    <rect x="900" y="580" width="200" height="640" />
    <rect x="1140" y="740" width="150" height="500" />
    <rect x="1320" y="640" width="180" height="600" />
    <rect x="1540" y="720" width="130" height="510" />
    <rect x="1720" y="560" width="210" height="680" />
    <rect x="1980" y="700" width="160" height="520" />
    <rect x="2160" y="760" width="140" height="460" />
    <rect x="60" y="780" width="90" height="460" />
  </g>
  <rect width="2400" height="1400" filter="url(#grain)" opacity="0.35" />
</svg>
